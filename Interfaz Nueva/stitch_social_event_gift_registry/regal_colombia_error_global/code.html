<style>

<body class="bg-background text-on-surface font-body-md overflow-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar (Suppressed for focused error state per logic) -->
<!-- We skip TopAppBar and BottomNavBar to prioritize the "dead end" content canvas as per UX guidelines -->
<main class="relative min-h-screen w-full flex items-center justify-center p-container-margin pearl-gradient">
<!-- Atmospheric Blobs -->
<div class="absolute top-[-10%] right-[-10%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary-container/5 rounded-full blur-[120px]"></div>
<div class="relative z-10 w-full max-w-lg text-center space-y-8">
<!-- Large Emoji Container -->
<div class="flex justify-center">
<div class="animate-float glass-panel soft-glow w-32 h-32 md:w-40 md:h-40 rounded-[2rem] flex items-center justify-center text-6xl md:text-7xl shadow-xl transition-all duration-500 hover:rotate-3">
<span aria-label="Confused face" role="img">😕</span>
</div>
</div>
<!-- Content Section -->
<div class="space-y-4 px-4">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tight">
                    Algo salió mal
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto leading-relaxed">
                    Lo sentimos, ha ocurrido un error inesperado. Por favor, intenta recargar la página para continuar celebrando.
                </p>
</div>
<!-- Action Area -->
<div class="flex flex-col items-center gap-6 pt-4">
<button class="brand-gradient text-on-primary font-label-md text-label-md px-10 py-4 rounded-full shadow-[0_8px_20px_rgba(177,14,107,0.3)] hover:shadow-[0_12px_28px_rgba(177,14,107,0.4)] active:scale-95 transition-all duration-200 group flex items-center gap-2" onclick="window.location.reload()">
<span class="material-symbols-outlined text-xl group-hover:rotate-180 transition-transform duration-500" data-icon="refresh">refresh</span>
                    Recargar página
                </button>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200 border-b border-transparent hover:border-primary pb-1" href="/">
                    Volver al inicio
                </a>
</div>
<!-- Subtle Error Trace ID (Mocked for premium look) -->
<div class="pt-12 opacity-30">
<p class="font-caption text-caption uppercase tracking-widest text-on-surface-variant">
                    Error ID: ERR_EVENT_FLOW_6782
                </p>
</div>
</div>
</main>
<!-- Visual Polish: Interactive mouse movement effect -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const intensity = 10;
            const floatX = (x - 0.5) * intensity;
            const floatY = (y - 0.5) * intensity;
            
            const panel = document.querySelector('.glass-panel');
            if (panel) {
                panel.style.transform = `translate3d(${floatX}px, ${floatY}px, 0) rotate3d(${-floatY}, ${floatX}, 0, 5deg)`;
            }
        });
    </script>

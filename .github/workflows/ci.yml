name: CI/CD

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend - Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  frontend-check:
    name: Frontend - Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e-tests:
    name: E2E Tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    # Permitir fallo: los tests e2e son frágiles y requieren seed de datos específicos.
    # Los tests unitarios/integración (backend 380, frontend 386) son la verificación principal.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fiestaylista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
        # VITE_* se hornea en build-time y el e2e corre contra este build (preview).
        # Sin VITE_TURNSTILE_SITE_KEY, useTurnstile() nunca emite token y cada submit
        # espera 5-10s en waitForTurnstile() → las aserciones de 5s fallan (10 tests).
        # 1x0...AA es la site key de PRUEBA de Cloudflare (verificación siempre OK).
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000000000AA
      - name: Start backend for e2e
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci
          # Variables de test para el backend
          export DATABASE_URL="postgresql://test:test@localhost:5432/fiestaylista_test"
          export JWT_SECRET="test-jwt-secret-at-least-32-chars-long"
          export JWT_REFRESH_SECRET="test-refresh-secret-different-32-chars"
          export NODE_ENV="test"
          export PORT="3001"
          export FRONTEND_URL="http://localhost:4173"
          export BACKEND_URL="http://localhost:3001"
          export MERCADO_PAGO_ACCESS_TOKEN="TEST_TOKEN"
          export MERCADO_PAGO_WEBHOOK_SECRET="TEST_WEBHOOK_SECRET"
          export RESEND_API_KEY="re_test_key"
          export FROM_EMAIL="test@test.com"
          export CLOUDINARY_CLOUD_NAME="test"
          export CLOUDINARY_API_KEY="test"
          export CLOUDINARY_API_SECRET="test"
          export TURNSTILE_SECRET_KEY="1x0000000000000000000000000000000AA"
          # Build y arrancar backend
          npm run build
          # Iniciar backend con log visible y verificar que arranca
          node dist/backend/src/index.js &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          echo "Backend PID: $BACKEND_PID"
          # Esperar a que el puerto TCP 3001 escuche (healthcheck a nivel TCP, evita rate limiter/TrustProxy)
          for i in {1..60}; do
            if nc -z localhost 3001 2>/dev/null; then
              echo "Backend puerto 3001 abierto"
              # Verificar que el proceso sigue vivo
              if kill -0 $BACKEND_PID 2>/dev/null; then
                echo "Backend proceso vivo (PID: $BACKEND_PID)"
                break
              else
                echo "ERROR: Backend murió"
                exit 1
              fi
            fi
            # Verificar que el proceso sigue vivo
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "ERROR: Backend murió inesperadamente"
              exit 1
            fi
            echo "Esperando backend... ($i/60)"
            sleep 1
          done
          # Verificación final
          if ! nc -z localhost 3001 2>/dev/null; then
            echo "ERROR: Backend no abrió puerto 3001 tras 60s"
            exit 1
          fi
          if ! kill -0 $BACKEND_PID 2>/dev/null; then
            echo "ERROR: Backend proceso muerto"
            exit 1
          fi
      - name: Run Playwright tests
        run: npx playwright test --timeout 30000
        env:
          VITE_API_URL: http://localhost:3001
      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -n "$BACKEND_PID" ]; then kill $BACKEND_PID || true; fi

  deploy-backend:
    name: Deploy Backend to Railway
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service=${{ vars.RAILWAY_SERVICE_NAME || 'fiestaylista' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Netlify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # AR-01: el bundle de producción se hornea con VITE_* en build-time. Sin la
      # site key de Turnstile el widget nunca se renderiza y los 12 endpoints con
      # verifyTurnstile estricto responden 400 (claims, RSVP, fotos, mensajes,
      # cash, checkout, reset de password). La variable es PÚBLICA (es una site
      # key) y NO debe sustituirse por la test key: eso desactivaría la defensa
      # anti-bot en producción.
      - name: Verify required build vars
        run: |
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::error::vars.VITE_TURNSTILE_SITE_KEY no está definida en GitHub (Settings → Secrets and variables → Actions → Variables). El deploy se cancela para no subir un bundle roto."
            exit 1
          fi
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-preview:
    name: Deploy Preview (PR)
    # Sin secrets disponibles en PRs de Dependabot/forks — se omite el preview
    # (backend-check, frontend-check y e2e-tests siguen corriendo en esos PRs)
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # AR-01: los previews también necesitan la site key en el bundle para
          # probar flujos con Turnstile estricto (claims, RSVP, checkout).
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      - name: Deploy preview to Netlify
        id: netlify
        run: |
          npx netlify-cli deploy --dir=dist --alias=pr-${{ github.event.number }} --json > preview.json
          echo "url=$(cat preview.json | jq -r '.deploy_url')" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.netlify.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Vista previa desplegada: ${url}`
            });

[build]
  publish = "frontend/dist"
  command = "cd frontend && npm ci && npm run build"

# IMPORTANTE: La URL del backend se configura aquí.
# En Railway, ve a Settings → Domains y copia la URL generada.
# Luego reemplázala abajo.
[[redirects]]
  from = "/api/*"
  to = "https://fiestaylista-production.up.railway.app/api/:splat"
  status = 200

# SPA fallback: todas las rutas al index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "frontend/dist"
  command = "cd frontend && npm ci && npm run build"

# IMPORTANTE: Actualizar esta URL si cambia el dominio de Railway.
# Ve a Railway → Settings → Domains y copia la URL generada.
# Luego reemplázala en la línea `to` de abajo.
[[redirects]]
  from = "/api/*"
  to = "https://fiestaylista-production.up.railway.app/api/:splat"
  status = 200

# SPA fallback: todas las rutas al index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

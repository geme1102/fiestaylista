[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

# Edge Function: OG tags dinamicas por evento para crawlers sociales
[[edge_functions]]
  function = "event-og"
  path = "/e/*"

[[redirects]]
  from = "/api/*"
  to = "https://fiestaylista-production.up.railway.app/api/:splat"
  status = 200

# Favicon SVG: cache inmutable
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon PNG: cache inmutable
[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon ICO: cache inmutable
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon*"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML nunca se cachea — siempre revalidar para propagar nuevos hashes de CSS/JS
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Assets con hash fingerprint — cache inmutable de 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker — sin cache para que se actualice cuanto antes
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# SPA fallback: todas las rutas al index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

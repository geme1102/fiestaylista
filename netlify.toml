[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

# Edge Function: OG tags dinamicas por evento para crawlers sociales
[[edge_functions]]
  function = "event-og"
  path = "/e/*"

[[redirects]]
  from = "/api/*"
  to = "https://fiestaylista-production.up.railway.app/api/:splat"
  status = 200

# Favicon SVG: cache inmutable
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon PNG: cache inmutable
[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon ICO: cache inmutable
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon*"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML nunca se cachea — siempre revalidar para propagar nuevos hashes de CSS/JS
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Assets con hash fingerprint — cache inmutable de 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker — sin cache para que se actualice cuanto antes
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Manifest — sin cache para propagar cambios de installability
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# SPA fallback: todas las rutas al index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'report-sample' https://challenges.cloudflare.com; script-src-attr 'none'; frame-src 'self' https://mpago.la https://challenges.cloudflare.com; img-src 'self' https://res.cloudinary.com data: blob:; style-src 'self' 'unsafe-inline' 'report-sample'; style-src-elem 'self' 'unsafe-inline' 'report-sample' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; connect-src 'self' https://fiestaylista-production.up.railway.app https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' https://res.cloudinary.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://mpago.la; upgrade-insecure-requests; report-uri /api/csp-report"
